    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="62%">
      <stop offset="0" stop-color="#a2677f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a2677f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.2">
