    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="62%">
      <stop offset="0" stop-color="#b07a42" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#b07a42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.2">
